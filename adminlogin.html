<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Tewuneed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-container">
      <div class="logo">
        <h2>Tewuneed Admin</h2>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>

  <!-- Firebase & Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDz5t6mlBzXq7bjK3PGOGyEBo_WzjsHYME",
      authDomain: "tewuneed-marketplace.firebaseapp.com",
      databaseURL: "https://tewuneed-marketplace.firebaseio.com",
      projectId: "tewuneed-marketplace",
      storageBucket: "tewuneed-marketplace.appspot.com",
      messagingSenderId: "999093621738",
      appId: "1:999093621738:web:87b68aa3a5a5ebca395893",
      measurementId: "G-8WNLD8T7GY"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    // Login Function
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorMessage.classList.add('d-none');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Check if user is admin
          const userId = userCredential.user.uid;
          return database.ref('admins/' + userId).once('value');
        })
        .then((snapshot) => {
          if (snapshot.exists()) {
            // Redirect to admin dashboard
            window.location.href = 'admin.html';
          } else {
            throw new Error('Anda tidak memiliki akses admin');
          }
        })
        .catch((error) => {
          showError(error.message);
          auth.signOut(); // Ensure user is logged out
        });
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('d-none');
    }
  </script>
</body>
</html>
