<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <!-- Login Form (Awal) -->
    <div id="login-section" class="card p-4">
      <h2>Login Admin</h2>
      <input id="email" type="email" class="form-control mb-2" placeholder="Email">
      <input id="password" type="password" class="form-control mb-2" placeholder="Password">
      <button id="login-btn" class="btn btn-primary">Login</button>
    </div>

    <!-- Admin Panel (Setelah Login) -->
    <div id="admin-panel" class="mt-4" style="display: none;">
      <h2>Kelola Produk</h2>
      <button id="logout-btn" class="btn btn-danger mb-3">Logout</button>
      
      <!-- Form Tambah Produk -->
      <div class="card p-4 mb-4">
        <h4>Tambah Produk Baru</h4>
        <input id="product-name" class="form-control mb-2" placeholder="Nama Produk">
        <input id="product-price" type="number" class="form-control mb-2" placeholder="Harga">
        <input id="product-stock" type="number" class="form-control mb-2" placeholder="Stok">
        <button id="add-product-btn" class="btn btn-success">Tambah</button>
      </div>

      <!-- Daftar Produk -->
      <table class="table">
        <thead>
          <tr>
            <th>Nama</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="products-list">
          <!-- Produk akan dimuat di sini via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Script Supabase & Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
